  name: Build and Push FishTank Images

  on:
    push:
      branches:
        - main
        - master
    workflow_dispatch:

  concurrency:
    group: build-push-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    build-and-push:
      name: Build and push Docker images
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write

      env:
          NW_CONFIG: ${{ github.workspace }}/current-repo/config.json

      steps:
        - name: Checkout fishtank repo
          uses: actions/checkout@v6
          with:
            repository: vigneshsubbaram/fishtank
            ref: master

        - name: Log in to GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Build and push ssh
          uses: docker/build-push-action@v6
          with:
            context: "https://github.com/vigneshsubbaram/raikou-net.git#main:components/ssh"
            push: true
            tags: |
              ghcr.io/${{ github.repository_owner }}/ssh:v1.2.0
              ghcr.io/${{ github.repository_owner }}/ssh:latest
            cache-from: type=gha,scope=ssh
            cache-to: type=gha,mode=max,scope=ssh

        - name: Pull ssh into local daemon for downstream builds
          run: |
            docker pull ghcr.io/${{ github.repository_owner }}/ssh:v1.2.0
            docker tag ghcr.io/${{ github.repository_owner }}/ssh:v1.2.0 ssh:v1.2.0

        - name: Build ota-base
          env:
              DOCKER_BUILDKIT: 0
              COMPOSE_DOCKER_CLI_BUILD: 0
          run: |
              docker compose build --no-cache ota-base
              docker tag ota-base ghcr.io/${{ github.repository_owner }}/ota-base:container_utils_1.1.1
              docker push ghcr.io/${{ github.repository_owner }}/ota-base:container_utils_1.1.1

        - name: Build ota-server
          env:
              DOCKER_BUILDKIT: 0
              COMPOSE_DOCKER_CLI_BUILD: 0
          run: |
              docker compose build --no-cache ota-server
              docker tag ota-server ghcr.io/${{ github.repository_owner }}/ota-server:container_utils_1.1.1
              docker push ghcr.io/${{ github.repository_owner }}/ota-server:container_utils_1.1.1

        - name: Build mtt
          env:
              DOCKER_BUILDKIT: 0
              COMPOSE_DOCKER_CLI_BUILD: 0
          run: |
              docker compose build --no-cache mtt
              docker tag mtt ghcr.io/${{ github.repository_owner }}/mtt-ssh:prod
              docker push ghcr.io/${{ github.repository_owner }}/mtt-ssh:prod

        - name: Build orchestrator
          env:
              DOCKER_BUILDKIT: 0
              COMPOSE_DOCKER_CLI_BUILD: 0
          run: |
              docker compose build --no-cache orchestrator
              docker tag raikou/raikou-net ghcr.io/${{ github.repository_owner }}/raikou-net:alpine3.18-dind-ovs_2.17
              docker push ghcr.io/${{ github.repository_owner }}/raikou-net:alpine3.18-dind-ovs_2.17
